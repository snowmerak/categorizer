[project]
name = "categorizer"
version = "0.1.0"
description = "Local hierarchical categorization with Qwen or LFM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "hf-xet>=1.6.0",
    "huggingface-hub>=0.30",
    "torch>=2.6",
    "transformers>=5.1,<6",
    "uvicorn>=0.30",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28",
]
